<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1565c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ประเมิน กปภ.">
<title>ระบบประเมินความพึงพอใจ กปภ.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1e88e5;--blue-d:#1565c0;--blue-dd:#0d47a1;--navy:#1a237e;--sky:#e3f2fd;--sky2:#f2f8fe;
  --kiosk:#338de8;--ink:#12263f;--mute:#5d7088;--line:#d9e6f3;--white:#fff;--bg:#eef5fc;
  --red:#e53935;--ok:#2e9e4f;
}
:root:not([data-theme="light"]){}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,-apple-system,'Noto Sans Thai',sans-serif;font-size:16px}
body{overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
#app{min-height:100%}
.hide{display:none!important}

/* ===== header ===== */
.hdr{background:linear-gradient(135deg,var(--blue-dd),var(--blue) 70%);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 14px rgba(13,71,161,.28);position:relative;z-index:5}
.hdr .logo{width:54px;height:54px;border-radius:12px;background:#fff;padding:2px;object-fit:contain;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25);user-select:none;-webkit-user-drag:none}
.hdr .t1{font-weight:800;font-size:19px;line-height:1.15}
.hdr .t2{font-size:14px;opacity:.92;font-weight:500}
.hdr .grow{flex:1;min-width:0}
.hdr .btn-ghost{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:8px 12px;font-weight:600}
.wave{height:6px;background:repeating-linear-gradient(90deg,#fff 0 18px,#90caf9 18px 36px);opacity:.9}

/* ===== generic ===== */
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(21,101,192,.06)}
h2{margin:0 0 10px;font-size:20px;color:var(--blue-dd)}
h3{margin:0 0 8px;font-size:16px;color:var(--blue-dd)}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:16px;background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(30,136,229,.3)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#fff;color:var(--blue-d);border:1.5px solid var(--blue);box-shadow:none}
.btn.red{background:var(--red)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:9px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
label.f{display:block;font-weight:600;font-size:14px;color:var(--mute);margin:10px 0 4px}
.in{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,136,229,.18)}
.muted{color:var(--mute);font-size:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;max-width:1180px;margin:0 auto}
.tab{border:0;background:#fff;border:1px solid var(--line);color:var(--blue-d);padding:10px 16px;border-radius:12px 12px 0 0;font-weight:700;white-space:nowrap;position:relative}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.badge{background:var(--red);color:#fff;border-radius:99px;font-size:12px;padding:1px 7px;margin-left:6px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{background:var(--sky);color:var(--blue-dd);text-align:left;padding:9px 10px;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tr:hover td{background:var(--sky2)}
.scroll{overflow-x:auto}
.kpi{background:linear-gradient(160deg,#fff,var(--sky));border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi .v{font-size:30px;font-weight:800;color:var(--blue-d)}
.kpi .l{font-size:14px;color:var(--mute)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700}
.pill.on{background:#e6f6ec;color:#1b7a3a}.pill.off{background:#eee;color:#777}
.ava{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--sky);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--blue-d);flex:none}
.stf{display:flex;gap:12px;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:90%}
.toast.alert{background:var(--red)}
.modal{position:fixed;inset:0;background:rgba(10,30,60,.55);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal .box{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
pre.code{background:#0f2238;color:#cde6ff;border-radius:12px;padding:12px;font-size:12px;overflow:auto;max-height:260px;white-space:pre}
.hero{text-align:center;padding:26px 16px}
.hero img{width:150px;height:150px;border-radius:24px;box-shadow:0 8px 28px rgba(21,101,192,.3)}
.hero h1{margin:14px 0 4px;color:var(--blue-dd);font-size:26px}
.big{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.big .btn{padding:18px 26px;font-size:18px;min-width:240px}

/* ===== kiosk ===== */
.kiosk{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation;
 background:radial-gradient(110% 60% at 90% -8%,rgba(144,202,249,.6),transparent 62%),radial-gradient(80% 55% at -10% 45%,rgba(66,165,245,.5),transparent 62%),linear-gradient(165deg,#0a3a8a 0%,#1565c0 45%,#1e88e5 100%)}
.kwave{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:0;pointer-events:none;opacity:.5;
 background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 200' preserveAspectRatio='none'><path d='M0 90 C150 40 300 140 450 90 S750 40 900 90 S1100 140 1200 90 V200 H0Z' fill='white' fill-opacity='.07'/><path d='M0 130 C200 80 350 180 600 130 S950 80 1200 130 V200 H0Z' fill='white' fill-opacity='.07'/></svg>") repeat-x bottom/1200px 100%;animation:wv 28s linear infinite}
@keyframes wv{to{background-position-x:-1200px}}
.k-head{position:relative;z-index:2;display:flex;align-items:center;gap:clamp(14px,2.6vw,28px);padding:calc(14px + env(safe-area-inset-top)) clamp(16px,3vw,36px) 6px}
.k-logo{width:clamp(92px,16vw,150px);height:clamp(92px,16vw,150px);border-radius:28px;background:#fff;padding:4px;object-fit:contain;flex:none;box-shadow:0 0 0 6px rgba(255,255,255,.22),0 16px 36px rgba(4,28,80,.5);-webkit-user-drag:none}
.k-org{font-family:'Prompt','Sarabun',sans-serif;font-weight:500;font-size:clamp(14px,2.7vw,23px);letter-spacing:.4px;opacity:.95}
.k-branch{font-family:'Prompt','Sarabun',sans-serif;font-weight:700;font-size:clamp(26px,6.2vw,54px);line-height:1.1;text-shadow:0 3px 14px rgba(0,30,90,.4)}
.k-tag{display:inline-block;margin-top:8px;padding:5px 18px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);font-weight:600;font-size:clamp(14px,2.4vw,20px);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.k-body{position:relative;z-index:2;flex:1;min-height:0;display:flex;padding:8px clamp(16px,3vw,36px) 14px}
.k-staff{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.35);border-radius:30px;padding:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(4,28,80,.28)}
.k-photo{flex:1;min-height:0;border-radius:22px;overflow:hidden;background:linear-gradient(160deg,#e3f2fd,#90caf9);box-shadow:0 0 0 4px #fff,0 10px 26px rgba(4,28,80,.35);display:flex;align-items:center;justify-content:center;margin:4px 4px 0}
.k-photo img{width:100%;height:100%;object-fit:cover;object-position:center top}
.k-photo .ph{font-family:'Prompt',sans-serif;font-size:clamp(70px,16vw,140px);font-weight:700;color:#1565c0;opacity:.7}
.k-info{text-align:center;padding:0 4px 4px}
.k-name{font-family:'Prompt','Sarabun',sans-serif;font-weight:700;font-size:clamp(24px,5.6vw,44px);line-height:1.18;text-shadow:0 2px 10px rgba(0,30,90,.4)}
.k-pos{display:inline-block;margin-top:6px;background:#fff;color:#0d47a1;font-weight:700;border-radius:99px;padding:4px 22px;font-size:clamp(16px,3.4vw,27px);box-shadow:0 4px 12px rgba(4,28,80,.25)}
.k-meta{margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:clamp(14px,2.6vw,21px);font-weight:500}
.k-meta span{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:2px 14px}
.k-rate{position:relative;z-index:3;background:#fff;color:var(--ink);border-radius:36px 36px 0 0;padding:16px clamp(12px,2.6vw,30px) calc(16px + env(safe-area-inset-bottom));box-shadow:0 -14px 44px rgba(4,28,80,.32)}
.k-q{text-align:center;font-family:'Prompt','Sarabun',sans-serif;font-weight:600;color:#0d47a1;font-size:clamp(19px,4vw,32px);line-height:1.25}
.k-q small{display:block;font-family:'Sarabun',sans-serif;font-weight:500;color:var(--mute);font-size:clamp(13px,2.2vw,18px);margin-top:2px}
.emo{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,1.6vw,18px);margin-top:12px}
.emo button{position:relative;background:linear-gradient(180deg,#fff,#f0f6fd);border:2px solid #e0ebf8;border-radius:24px;padding:clamp(8px,1.6vw,16px) 2px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 16px rgba(21,101,192,.13);transition:transform .22s cubic-bezier(.3,1.7,.5,1),box-shadow .2s,border-color .2s,opacity .2s;overflow:hidden}
.emo button::after{content:'';position:absolute;left:0;right:0;bottom:0;height:7px;background:var(--c)}
.emo .face{width:clamp(48px,13vw,108px);height:auto;aspect-ratio:1;filter:drop-shadow(0 5px 6px rgba(0,0,0,.2));pointer-events:none}
.emo .t{font-family:'Prompt','Sarabun',sans-serif;font-weight:600;font-size:clamp(14px,3vw,25px);color:var(--c);pointer-events:none}
.emo button.pop{transform:scale(1.22);z-index:4;border-color:var(--c);box-shadow:0 0 0 6px var(--g),0 14px 34px rgba(4,28,80,.35)}
.emo button.dim{opacity:.4;transform:scale(.94)}
@media (min-width:900px) and (orientation:landscape){
  .kiosk{display:grid;grid-template-columns:minmax(360px,42%) 1fr;grid-template-rows:auto minmax(0,1fr)}
  .k-head{grid-column:1/-1}
  .k-body{padding-right:clamp(10px,2vw,24px);padding-bottom:22px}
  .k-rate{border-radius:38px;margin:8px clamp(16px,3vw,36px) 22px 0;display:flex;flex-direction:column;justify-content:center;padding:clamp(18px,3vw,40px)}
  .k-q{font-size:clamp(24px,3vw,40px)}
  .emo{gap:clamp(10px,1.6vw,22px);margin-top:clamp(18px,3vw,40px)}
  .emo .face{width:clamp(64px,8.5vw,130px)}
  .emo .t{font-size:clamp(18px,2.2vw,30px)}
  .emo button{padding-top:clamp(14px,2vw,26px);padding-bottom:18px}
}
.k-gear{position:absolute;top:calc(10px + env(safe-area-inset-top));right:clamp(12px,2.5vw,28px);width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);font-size:20px;line-height:1;opacity:.55;color:#fff}
.k-gear:active{opacity:1}
@media (max-width:520px){.k-tag .en{display:none}}
@media (prefers-reduced-motion:reduce){.kwave{animation:none}}
.thanks{position:fixed;inset:0;z-index:60;background:radial-gradient(90% 60% at 50% 30%,#42a5f5,transparent 70%),linear-gradient(160deg,#0a3a8a,#1565c0 55%,#1e88e5);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:fade .3s;overflow:hidden}
.thanks .rings{position:absolute;left:50%;top:38%;width:10px;height:10px;border-radius:50%;border:3px solid rgba(255,255,255,.5);transform:translate(-50%,-50%);animation:rip 2.4s ease-out infinite}
.thanks .rings.b{animation-delay:1.2s}
@keyframes rip{from{width:10px;height:10px;opacity:.9}to{width:130vmax;height:130vmax;opacity:0}}
.thanks .t-face{width:min(52vw,300px);position:relative;animation:bounce .8s;filter:drop-shadow(0 14px 22px rgba(0,0,0,.3))}
.thanks h1{font-family:'Prompt','Sarabun',sans-serif;font-size:clamp(38px,9vw,68px);margin:14px 0 4px;text-shadow:0 3px 14px rgba(0,30,90,.4);position:relative}
.thanks p{font-size:clamp(18px,4vw,28px);margin:0;position:relative}
.thanks .t-b{margin-top:22px;font-size:clamp(14px,2.6vw,20px);opacity:.85;position:relative}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bounce{0%{transform:scale(.2)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.hdr .t1{font-family:'Prompt','Sarabun',sans-serif}
.hdr .logo{width:64px;height:64px}
.hero h1{font-family:'Prompt','Sarabun',sans-serif}

/* print */
#printArea{display:none}
@media print{
  body.printing #app,body.printing .toast,body.printing .modal{display:none!important}
  body.printing #printArea{display:block;padding:10mm;color:#000;background:#fff}
  @page{size:A4;margin:10mm}
}
#printArea h1{font-size:20px;margin:0}
#printArea table{margin:8px 0 16px;font-size:12px}
#printArea th{background:#d7e8fa!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printArea .ph{display:flex;gap:12px;align-items:center;border-bottom:3px solid #1565c0;padding-bottom:8px;margin-bottom:10px}
#printArea .ph img{width:64px;height:64px}
</style>
</head>

  settings:{branch:'กปภ.สาขาอ่างทอง',org:'การประปาส่วนภูมิภาค',pin:'1234',logo:'',webhook:'',alertEmail:'',alertMax:2,recipients:[],thanksText:'ขอบคุณสำหรับการประเมินค่ะ',audio:'',volume:1},

function load(){
  try{const o=JSON.parse(localStorage.getItem(KEY)||'null');
    if(o){return {...DEF,...o,settings:{...DEF.settings,...(o.settings||{})}}}}catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('พื้นที่จัดเก็บเต็ม กรุณาลดขนาดรูปหรือสำรอง/ล้างข้อมูลเก่า','alert')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r=document)=>r.querySelector(s);

const pad=n=>String(n).padStart(2,'0');
const fmtDT=t=>{const d=new Date(t);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()+543} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`};

const now=new Date();
const ui={view:'home',tab:'report',period:'month',date:isoDay(now),month:`${now.getFullYear()}-${pad(now.getMonth()+1)}`,year:String(now.getFullYear()),from:isoDay(now),to:isoDay(now),staff:'all',lastAlertSeen:S.alerts.length};

/* ---------- helpers ---------- */
function toast(msg,kind){
  const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),kind==='alert'?6000:2600);
}
function modal(html){
  return new Promise(res=>{
    const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box">${html}</div>`;
    document.body.appendChild(m);
    m.close=v=>{m.remove();res(v)};
    m.addEventListener('click',e=>{if(e.target===m)m.close(null)});
    m._res=res;window._modal=m;
    const f=m.querySelector('[autofocus]');if(f)setTimeout(()=>f.focus(),50);
  });
}
function askPin(title){
  return new Promise(res=>{
    const m=document.createElement('div');m.className='modal';
    m.innerHTML=`<div class="box" style="text-align:center"><h2>${esc(title||'ใส่รหัสผู้ดูแลระบบ')}</h2><input id="pinI" class="in" type="password" inputmode="numeric" autocomplete="off" placeholder="รหัส PIN" style="text-align:center;font-size:24px;letter-spacing:8px" autofocus><div class="row end" style="margin-top:14px"><button class="btn sec" id="pc">ยกเลิก</button><button class="btn" id="po">ยืนยัน</button></div></div>`;
    document.body.appendChild(m);
    const done=v=>{m.remove();res(v)};
    const go=()=>{const v=$('#pinI',m).value;if(v===S.settings.pin)done(true);else{toast('รหัสไม่ถูกต้อง','alert');$('#pinI',m).value='';}};
    $('#po',m).onclick=go;$('#pc',m).onclick=()=>done(false);
    $('#pinI',m).addEventListener('keydown',e=>{if(e.key==='Enter')go()});
    setTimeout(()=>$('#pinI',m).focus(),60);
  });
}
function imgToData(file,max,type){
  return new Promise((res,rej)=>{
    const fr=new FileReader();fr.onerror=rej;
    fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');
      if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
      x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL(type,.85));
    };im.src=fr.result};fr.readAsDataURL(file);
  });
}
function fileToData(file){return new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(file)})}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const initials=n=>(String(n||'?').replace(/^(นางสาว|นาง|นาย|น\.ส\.)/,'').trim()[0]||'?');
const ava=(p,n,sz)=>p?`<img class="ava" style="${sz?`width:${sz}px;height:${sz}px`:''}" src="${p}" alt="">`:`<span class="ava" style="${sz?`width:${sz}px;height:${sz}px`:''}">${esc(initials(n))}</span>`;

/* ---------- audio ---------- */
let voicesCache=[];
if('speechSynthesis' in window){const lv=()=>{voicesCache=speechSynthesis.getVoices()};lv();speechSynthesis.onvoiceschanged=lv}
function pickVoice(){
  const th=voicesCache.filter(v=>/^th/i.test(v.lang));
  return th.find(v=>/kanya|premwadee|female|หญิง|google/i.test(v.name))||th[0]||null;
}
function playThanks(){
  try{
    if(S.settings.audio){const a=new Audio(S.settings.audio);a.volume=S.settings.volume;a.play().catch(()=>{});return}
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(S.settings.thanksText||'ขอบคุณสำหรับการประเมินค่ะ');
    u.lang='th-TH';const v=pickVoice();if(v)u.voice=v;u.pitch=1.15;u.rate=.92;u.volume=S.settings.volume;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- ratings / sync ---------- */
function matchRecipients(st){
  return (S.settings.recipients||[]).filter(x=>x.active!==false&&(x.scope==='all'||(x.scope==='dept'&&(x.depts||[]).includes(st.dept))||(x.scope==='staff'&&(x.staffIds||[]).includes(st.id))));
}
function submitRating(staff,score){
  const r={id:uid(),staffId:staff.id,name:staff.name,code:staff.code,position:staff.position,dept:staff.dept,score,ts:Date.now()};
  S.ratings.push(r);
  const low=score<=Number(S.settings.alertMax||2);
  let rcp=[];
  if(low){rcp=matchRecipients(staff);S.alerts.push({id:uid(),ratingId:r.id,ts:r.ts,read:false,name:staff.name,code:staff.code,dept:staff.dept,score,to:rcp.map(x=>x.name)})}
  S.queue.push({rid:r.id,low,rcp:rcp.map(x=>({name:x.name,email:x.email,line:x.line}))});
  save();flushQueue();
}
async function flushQueue(){
  const url=(S.settings.webhook||'').trim();
  if(!url){return}
  if(flushQueue.busy)return;flushQueue.busy=true;
  try{
    while(S.queue.length){
      const q=S.queue[0];const r=S.ratings.find(x=>x.id===q.rid);
      if(!r){S.queue.shift();continue}
      const payload={type:'rating',branch:S.settings.branch,id:r.id,time:fmtDT(r.ts),iso:new Date(r.ts).toISOString(),code:r.code,name:r.name,position:r.position,dept:r.dept,score:r.score,label:LV[r.score-1].t,low:q.low,recipients:q.rcp||[],fallbackEmail:S.settings.alertEmail};
      await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
      S.queue.shift();save();
    }
  }catch(e){/* ออฟไลน์ — เก็บคิวไว้ส่งใหม่ */}
  flushQueue.busy=false;
}
window.addEventListener('online',flushQueue);
setInterval(flushQueue,30000);

/* ---------- stats ---------- */
function getRange(){
  let a,b;
  if(ui.period==='day'){a=new Date(ui.date+'T00:00:00');b=new Date(a);b.setDate(b.getDate()+1)}
  else if(ui.period==='month'){const [y,m]=ui.month.split('-').map(Number);a=new Date(y,m-1,1);b=new Date(y,m,1)}
  else if(ui.period==='year'){const y=Number(ui.year);a=new Date(y,0,1);b=new Date(y+1,0,1)}
  else{a=new Date(ui.from+'T00:00:00');b=new Date(ui.to+'T00:00:00');b.setDate(b.getDate()+1)}
  return [a.getTime(),b.getTime()];
}
function periodLabel(){
  const [a,b]=getRange();const d=t=>{const x=new Date(t);return `${x.getDate()}/${x.getMonth()+1}/${x.getFullYear()+543}`};
  if(ui.period==='day')return 'รายวัน '+d(a);
  if(ui.period==='month'){const x=new Date(a);return `รายเดือน ${['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][x.getMonth()]} ${x.getFullYear()+543}`}
  if(ui.period==='year')return 'รายปี พ.ศ. '+(Number(ui.year)+543);
  return `${d(a)} – ${d(b-1)}`;
}
function filtered(){
  const [a,b]=getRange();
  return S.ratings.filter(r=>r.ts>=a&&r.ts<b&&(ui.staff==='all'||r.staffId===ui.staff));

function stat(list){
  const n=list.length,dist=[0,0,0,0,0];list.forEach(r=>dist[r.score-1]++);
  const sum=list.reduce((s,r)=>s+r.score,0);
  return {n,dist,avg:n?sum/n:0,sat:n?(dist[3]+dist[4])/n*100:0,low:dist[0]+dist[1]};
}
function perStaff(list){
  const m=new Map();
  S.staff.forEach(s=>m.set(s.id,{id:s.id,name:s.name,code:s.code,position:s.position,dept:s.dept,photo:s.photo,list:[]}));
  list.forEach(r=>{if(!m.has(r.staffId))m.set(r.staffId,{id:r.staffId,name:r.name,code:r.code,position:r.position,dept:r.dept,list:[]});m.get(r.staffId).list.push(r)});
  return [...m.values()].map(x=>({...x,...stat(x.list)})).sort((a,b)=>b.avg-a.avg||b.n-a.n);
}
function trend(list){
  const [a,b]=getRange();const buckets=[];
  let keyf,lab;
  const days=Math.round((b-a)/864e5);
  if(ui.period==='day'){for(let h=0;h<24;h++)buckets.push({k:h,l:String(h)});keyf=r=>new Date(r.ts).getHours()}
  else if(ui.period==='year'||(ui.period==='custom'&&days>62)){
    const s=new Date(a),e=new Date(b-1);
    for(let y=s.getFullYear(),m=s.getMonth();y<e.getFullYear()||(y===e.getFullYear()&&m<=e.getMonth());){buckets.push({k:y*12+m,l:ui.period==='year'?String(m+1):`${m+1}/${String(y+543).slice(2)}`});m++;if(m>11){m=0;y++}}
    keyf=r=>{const d=new Date(r.ts);return d.getFullYear()*12+d.getMonth()}
  }else{for(let i=0;i<days;i++){const d=new Date(a);d.setDate(d.getDate()+i);buckets.push({k:isoDay(d),l:String(d.getDate())})}keyf=r=>isoDay(new Date(r.ts))}
  buckets.forEach(x=>{x.s=0;x.n=0});
  const idx=new Map(buckets.map((x,i)=>[x.k,i]));
  list.forEach(r=>{const i=idx.get(keyf(r));if(i!=null){buckets[i].s+=r.score;buckets[i].n++}});
  return buckets;
}

/* ---------- SVG charts ---------- */
function chartTrend(bk){
  const W=640,H=230,L=34,R=10,T=14,B=28;const iw=W-L-R,ih=H-T-B;
  const x=i=>L+(bk.length<=1?iw/2:i*iw/(bk.length-1)),y=v=>T+ih-(v-1)/4*ih;
  let g='';for(let v=1;v<=5;v++)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#d9e6f3"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#5d7088">${v}</text>`;
  const maxN=Math.max(1,...bk.map(b=>b.n));
  let bars='',pts=[],lab='';
  const bw=Math.max(3,Math.min(22,iw/bk.length*.55));
  bk.forEach((b,i)=>{
    if(b.n){bars+=`<rect x="${x(i)-bw/2}" y="${T+ih-(b.n/maxN)*ih*.35}" width="${bw}" height="${(b.n/maxN)*ih*.35}" fill="#bbdefb" rx="2"/>`;pts.push([x(i),y(b.s/b.n),b.s/b.n,b.n])}
    const step=Math.ceil(bk.length/16);if(i%step===0)lab+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#5d7088">${b.l}</text>`;
  });
  const line=pts.length>1?`<polyline fill="none" stroke="#1565c0" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`:'';
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#1e88e5" stroke="#fff" stroke-width="1.5"><title>เฉลี่ย ${p[2].toFixed(2)} (${p[3]} ครั้ง)</title></circle>`).join('');
  if(!pts.length)return `<div class="muted" style="padding:40px;text-align:center">ยังไม่มีข้อมูลในช่วงเวลานี้</div>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}${bars}${line}${dots}${lab}</svg>`;
}
function chartDist(st){
  const max=Math.max(1,...st.dist);
  return LV.slice().reverse().map(l=>{const c=st.dist[l.n-1];const p=st.n?c/st.n*100:0;
    return `<div style="display:flex;align-items:center;gap:8px;margin:7px 0"><span style="width:92px;font-weight:600">${l.e} ${l.t}</span><div style="flex:1;background:#eef5fc;border-radius:8px;height:22px;overflow:hidden"><div style="width:${c/max*100}%;height:100%;background:${l.c};border-radius:8px;transition:width .5s"></div></div><span style="width:92px;text-align:right;font-size:14px">${c} (${p.toFixed(0)}%)</span></div>`}).join('');
}

"}"].join('\n');

function exportRows(){

  const det=[['วัน-เวลา','รหัสพนักงาน','ชื่อ-นามสกุล','ตำแหน่ง','สังกัด','คะแนน','ระดับ']].concat(list.map(r=>[fmtDT(r.ts),r.code,r.name,r.position,r.dept,r.score,LV[r.score-1].t]));

      },550);
      break;}
    case 'staffEdit': staffForm(id);break;
    case 'staffDel': if(confirm('ลบพนักงานคนนี้? (ผลประเมินเดิมจะยังอยู่ในรายงาน)')){S.staff=S.staff.filter(x=>x.id!==id);if(S.kioskStaffId===id)S.kioskStaffId=null;save();render()}break;
    case 'toggle': {const s=S.staff.find(x=>x.id===id);s.active=!s.active;if(!s.active&&S.kioskStaffId===id)S.kioskStaffId=null;save();render();break;}
    case 'kioskExit': if(await askPin('ผู้ดูแลระบบ — ออกจากโหมดเคาน์เตอร์')){S.kioskStaffId=null;save();ui.view='admin';render()}break;
    case 'rcpEdit': rcpForm(id);break;
    case 'rcpDel': if(confirm('ลบผู้รับรายนี้?')){S.settings.recipients=S.settings.recipients.filter(x=>x.id!==id);save();render()}break;
    case 'rcpToggle': {const x=S.settings.recipients.find(v=>v.id===id);x.active=x.active===false;save();render();break;}
    case 'alertsRead': S.alerts.forEach(x=>x.read=true);save();render();break;
    case 'exPdf': exportPdf();break;
    case 'exXlsx': exportXlsx();break;
    case 'exCsv': exportCsv();break;
    case 'logoReset': S.settings.logo='';save();render();break;
    case 'audioReset': S.settings.audio='';save();render();break;
    case 'testSound': playThanks();break;
    case 'testHook': {
      if(!S.settings.webhook){toast('ยังไม่ได้ใส่ Webhook URL','alert');break}
      try{await fetch(S.settings.webhook,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'rating',branch:S.settings.branch,id:'TEST-'+uid(),time:fmtDT(Date.now()),code:'TEST',name:'ทดสอบระบบ',position:'-',dept:'-',score:5,label:'ดีมาก',low:false})});toast('ส่งข้อมูลทดสอบแล้ว ตรวจสอบใน Google Sheet')}catch(_){toast('ส่งไม่สำเร็จ ตรวจสอบ URL/อินเทอร์เน็ต','alert')}
      break;}
    case 'copyGas': try{await navigator.clipboard.writeText(GAS);toast('คัดลอกแล้ว')}catch(_){toast('คัดลอกไม่ได้ กรุณาเลือกข้อความด้วยตนเอง','alert')}break;
    case 'backup': download(`backup_${isoDay(new Date())}.json`,new Blob([JSON.stringify(S)],{type:'application/json'}));break;
    case 'demo': loadDemo();render();toast('โหลดข้อมูลตัวอย่างแล้ว');break;
    case 'wipe': if(confirm('ล้างผลประเมิน/แจ้งเตือนทั้งหมด? ย้อนกลับไม่ได้')){S.ratings=[];S.alerts=[];S.queue=[];save();render()}break;
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.bind){ui[t.dataset.bind]=t.value;if(t.dataset.bind==='period'&&t.value==='custom'){}render();return}
  if(t.dataset.set){let v=t.value;if(t.dataset.set==='volume'||t.dataset.set==='alertMax')v=Number(v);
    if(t.dataset.set==='pin'&&!/^\d{4,8}$/.test(v)){toast('PIN ต้องเป็นตัวเลข 4–8 หลัก','alert');render();return}
    S.settings[t.dataset.set]=v;save();if(['branch','org'].includes(t.dataset.set))toast('บันทึกแล้ว');if(t.dataset.set==='webhook')flushQueue();return}
  if(t.dataset.file==='logo'&&t.files[0]){S.settings.logo=await imgToData(t.files[0],512,'image/png');save();render()}
  if(t.dataset.file==='audio'&&t.files[0]){S.settings.audio=await fileToData(t.files[0]);save();render();playThanks()}
  if(t.dataset.file==='restore'&&t.files[0]){try{const o=JSON.parse(await t.files[0].text());S={...DEF,...o,settings:{...DEF.settings,...o.settings}};save();render();toast('กู้คืนข้อมูลแล้ว')}catch(_){toast('ไฟล์ไม่ถูกต้อง','alert')}}
});

/* ---------- realtime refresh + low-score toast ---------- */
function tick(){
  const n=S.alerts.length;
  if(n>ui.lastAlertSeen&&ui.view==='admin'){const a=S.alerts[n-1];toast(`🔔 คะแนนต่ำ: ${a.name} (${a.dept}) ระดับ ${a.score}`,'alert')}
  ui.lastAlertSeen=n;
  const ae=document.activeElement;const typing=ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName);
  if(ui.view==='admin'&&ui.tab==='report'&&!typing&&!document.querySelector('.modal'))render();
}
setInterval(tick,5000);
window.addEventListener('storage',e=>{if(e.key===KEY){S=load();tick();if(ui.view==='admin'&&!document.querySelector('.modal'))render()}});

/* ---------- PWA ---------- */
(function(){
  const icon='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#1e88e5"/><path d="M256 90c40 62 74 100 74 146a74 74 0 0 1-148 0c0-46 34-84 74-146z" fill="#fff"/></svg>');
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=icon;document.head.appendChild(l);
  try{const mf={name:'ระบบประเมินความพึงพอใจ กปภ.',short_name:'ประเมิน กปภ.',start_url:'.',display:'standalone',background_color:'#338de8',theme_color:'#1565c0',orientation:'any',icons:[{src:icon,sizes:'512x512',type:'image/svg+xml'}]};
    const m=document.createElement('link');m.rel='manifest';m.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(mf));document.head.appendChild(m)}catch(e){}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
  try{navigator.wakeLock&&document.addEventListener('visibilitychange',()=>{})}catch(e){}
})();
// กันหน้าจอดับในโหมดเคาน์เตอร์
let wl=null;async function keepAwake(){try{if(ui.view==='kiosk'&&navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.onrelease=()=>wl=null}}catch(e){}}
document.addEventListener('click',keepAwake);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});

/* ---------- boot ---------- */
(function(){
  const s=S.staff.find(x=>x.id===S.kioskStaffId&&x.active);
  ui.view=s?'kiosk':'home';if(!s)S.kioskStaffId=null;
  render();
})();
</script>
